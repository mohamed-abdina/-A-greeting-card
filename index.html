<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Card</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  </head>
  <body>
    <div class="stars-container" id="stars"></div>
    <div class="confetti-container" id="confetti"></div>

    <div class="card-wrapper" id="cardWrapper">
      <div class="card" id="greetingCard">
        <div class="card-front">
          <div class="envelope">
            <div class="flap"></div>
            <div class="envelope-body"></div>
          </div>
          <p class="tap-hint">Tap to open</p>
        </div>
        <div class="card-inside">
          <div class="sparkle" id="sparkles"></div>
          <h1>Happy Birthday!</h1>
          <div class="recipient-name" id="recipientName"></div>
          <div class="cake">
            <div class="candle">
              <div class="flame"></div>
            </div>
            <div class="cake-top"></div>
            <div class="cake-middle"></div>
            <div class="cake-bottom"></div>
          </div>
          <p class="message">Wishing you all the happiness<br>and joy on your special day!</p>
          <p class="signature">With love &#10084;</p>
          <button class="blow-btn" id="blowBtn" title="Blow the candle!">&#127793;</button>
        </div>
        <div class="card-links">
          <a href="#send" class="send-link">Send Card</a>
          <a href="#share" class="share-link">Share on Social Media</a>
        </div>
      </div>
    </div>

    <div class="name-input-section">
      <label for="nameInput">Enter recipient's name:</label>
      <input type="text" id="nameInput" placeholder="e.g. Sarah" maxlength="30">
      <button id="updateNameBtn">Update Card</button>
    </div>

    <button class="download-btn" id="downloadBtn">&#128190; Download Card as Image</button>

    <section id="send">
      <h2>Sending your card...</h2>
      <p>Card successfully sent to your recipient!</p>
    </section>
    <section id="share">
      <h2>Sharing your card...</h2>
      <p>Your card was shared on social media!</p>
    </section>

    <script src="script.js"></script>
  </body>
</html>
