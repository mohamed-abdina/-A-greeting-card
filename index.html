<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting Card</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="confetti-container" id="confetti"></div>

    <div class="card-wrapper" id="cardWrapper">
      <div class="card" id="greetingCard">
        <div class="card-front">
          <div class="envelope">
            <div class="flap"></div>
            <div class="envelope-body"></div>
          </div>
          <p class="tap-hint">Tap to open</p>
        </div>
        <div class="card-inside">
          <div class="sparkle" id="sparkles"></div>
          <h1>Happy Birthday!</h1>
          <div class="cake">
            <div class="candle">
              <div class="flame"></div>
            </div>
            <div class="cake-top"></div>
            <div class="cake-middle"></div>
            <div class="cake-bottom"></div>
          </div>
          <p class="message">Wishing you all the happiness<br>and joy on your special day!</p>
          <p class="signature">With love &#10084;</p>
          <button class="blow-btn" id="blowBtn" title="Blow the candle!">&#127793;</button>
        </div>
        <div class="card-links">
          <a href="#send" class="send-link">Send Card</a>
          <a href="#share" class="share-link">Share on Social Media</a>
        </div>
      </div>
    </div>

    <section id="send">
      <h2>Sending your card...</h2>
      <p>Card successfully sent to your recipient!</p>
    </section>
    <section id="share"></section>

    <script src="script.js"></script>
  </body>
</html>
